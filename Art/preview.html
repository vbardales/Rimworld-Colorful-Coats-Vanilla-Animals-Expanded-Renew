<!doctype html>
<html><head><meta charset="utf-8"><title>Colorful Coats preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body,.stage{width:896px;height:504px;overflow:hidden}
.stage{position:relative;font-family:"Segoe UI",system-ui,sans-serif}
.shot{position:absolute;width:896px;height:504px;object-fit:cover;object-position:50% 55%}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse 1050px 720px at top left, rgb(var(--veil-rgb)/.96) 0%,rgb(var(--veil-rgb)/.90) 52%,rgb(var(--veil-rgb)/0) 84%)}
.text{position:absolute;left:50px;top:54px;color:var(--inkPrimary);text-shadow:0 3px 10px rgb(0 0 0/.75)}
h1{font-size:46px;font-weight:600;line-height:1.1;letter-spacing:0;width:735px}
h1 .suffix{font-size:.65em;color:var(--inkSecondary)}
.tag{font-size:24px;font-weight:400;line-height:1.1;letter-spacing:.2px;margin-top:8px;color:var(--inkSecondary)}
.rule{width:58px;height:3px;background:var(--accent);margin:20px 0 16px}
p{width:430px;font-size:21px;font-weight:400;line-height:1.45;color:var(--inkPrimary)}
.badge{position:absolute;right:0;top:0;width:80px;height:80px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%)}
.version{position:absolute;left:869px;top:27px;transform:translate(-50%,-50%) rotate(45deg);font-size:26px;font-weight:700;line-height:1;color:var(--badgeInk)}
</style></head><body><div class="stage"><img class="shot" src="Preview.png"><div class="veil"></div><div class="text">
<h1>Colorful Coats - Vanilla<br>Animals Expanded! <span class="suffix">Renew</span></h1>
<div class="tag">(unofficial)</div><div class="rule"></div>
<p>Coat variations for the cats, dogs and wildlife of Vanilla Animals Expanded.</p>
</div><div class="badge"></div><div class="version"></div></div>
<script>
window.ready=(async()=>{const p=await(await fetch('preview-palette.json')).json();for(const[k,v]of Object.entries(p))document.documentElement.style.setProperty('--'+k,v);document.documentElement.style.setProperty('--veil-rgb',p.veil.match(/[a-f\d]{2}/gi).map(x=>parseInt(x,16)).join(' '));const xml=new DOMParser().parseFromString(await(await fetch('../Mod/About/About.xml')).text(),'text/xml');const versions=[...xml.querySelectorAll('supportedVersions li')].map(x=>x.textContent.trim()).filter(x=>/^\d+(\.\d+)+$/.test(x)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));document.querySelector('.version').textContent=versions.at(-1);await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode()));})();
</script></body></html>
